<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跳转中</title>
  <style>
    /* 完全隐藏页面内容，白屏静默处理 */
    body { margin: 0; padding: 0; background: #ffffff; }
  </style>
</head>
<body>
  <script>
    (function() {
      // 记录开始时间，用于计算停留时长
      const startTime = Date.now();

      // 静默请求 /api/config，不显示任何提示
      fetch('/api/config?t=' + startTime, { cache: 'no-store' })
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(data => {
          const { url, fallbackUrl, blocked } = data;
          // 直接跳转，不显示任何信息
          if (blocked) {
            window.location.href = fallbackUrl;
          } else {
            window.location.href = url;
          }
        })
        .catch(() => {
          // 请求失败，跳转备用链接（可自定义默认地址）
          window.location.href = 'https://example.com/fallback';
        });
    })();
  </script>
</body>
</html>
