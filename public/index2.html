<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加载中</title>
  <style>
    body { margin: 0; padding: 0; background: #ffffff; }
  </style>
</head>
<body>
  <script>
    (function() {
      const startTime = Date.now();
      fetch('/api/config2?t=' + startTime, { cache: 'no-store' })
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(data => {
          const { url, fallbackUrl, blocked } = data;
          window.location.href = blocked ? fallbackUrl : url;
        })
        .catch(() => {
          window.location.href = 'https://example.com/fallback';
        });
    })();
  </script>
</body>
</html>
